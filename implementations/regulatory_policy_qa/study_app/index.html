<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regulatory QA · Study studio</title>
<style>
:root{font:15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;color:#18243c;background:#f3f5fa}*{box-sizing:border-box}body{margin:0}button,select,textarea{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #a494f8;outline-offset:2px}header{background:#fff;border-bottom:1px solid #e4e8f1;padding:16px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-weight:800;font-size:18px;letter-spacing:-.03em}.brand span{color:#6651ce}.topright{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.save{font-size:12px;color:#65728a}.error{color:#b42335}.layout{max-width:1500px;margin:26px auto;padding:0 24px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px}.sidebar,.panel{background:white;border:1px solid #e3e7f0;border-radius:16px;box-shadow:0 5px 20px #25325a08}.sidebar{padding:20px;height:fit-content}.sidebar h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#758199;margin:0 0 12px}.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qbtn{border:1px solid #e2e7f0;background:#fff;color:#516079;border-radius:9px;height:42px;font-weight:700}.qbtn.active{background:#6453c8;color:white;border-color:#6453c8}.qbtn.done:not(.active){background:#e7f7f0;color:#147a55;border-color:#b6e9d4}.legend{font-size:12px;color:#7b879a;margin:15px 0 0}.panel{padding:30px;min-width:0}.eyebrow{font-weight:800;color:#6955ce;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}h1{font-size:25px;line-height:1.3;letter-spacing:-.03em;margin:7px 0 10px}.sub{color:#6e7a90;margin:0}.timer{background:#f3f0ff;border-radius:12px;padding:10px 18px;min-width:132px;text-align:center;color:#5542ba}.timer small{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.1em;font-weight:800}.timer strong{font-variant-numeric:tabular-nums;font-size:25px;line-height:1.2}.timer.urgent{background:#fff0ef;color:#b42335}.steps{display:flex;gap:10px;margin:25px 0 20px}.step{padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700;background:#f2f4f8;color:#8791a3}.step.current{background:#eeeaff;color:#5844c4}.reading{background:#f8f9fc;border:1px solid #e9ecf2;border-radius:12px;padding:25px;max-height:48vh;overflow:auto;white-space:pre-wrap;line-height:1.8;color:#344058}.question{font-size:19px;font-weight:700;line-height:1.5;margin:18px 0}.source{font-size:13px;color:#6753c7}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}button.primary{background:#6553ca;color:white;border:0;border-radius:10px;padding:11px 18px;font-weight:700}button.secondary,select{border:1px solid #dce2ec;background:#fff;border-radius:9px;padding:9px 12px;color:#37445d}button:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:320px;resize:vertical;border:1px solid #d9dfeb;border-radius:12px;padding:16px;color:#18243c;background:#fff}textarea:disabled{background:#eef0f4;color:#7c8697;cursor:not-allowed}.meta{font-size:12px;color:#758199}.notice{background:#fff8e8;color:#795700;padding:11px 14px;border-radius:9px;font-size:13px;margin:14px 0}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:0 14px;margin:14px auto}.qgrid{grid-template-columns:repeat(10,1fr)}.qbtn{height:36px;font-size:12px}.panel{padding:20px}.heading{flex-wrap:wrap}.topright{margin-left:0}.reading{max-height:44vh}}@media(max-width:440px){.qgrid{grid-template-columns:repeat(5,1fr)}}
</style></head><body>
<header><div class="brand"><span>◈</span> Study studio</div><div class="topright"><span id="save" class="save" aria-live="polite">Connecting…</span><select id="sessions" aria-label="Choose a session"></select><button id="new" class="secondary">+ New session</button></div></header>
<div class="layout"><aside class="sidebar"><h2>Question navigator</h2><div id="grid" class="qgrid"></div><p class="legend">Purple: current · Green: time complete<br>Only the active question runs.</p></aside><main class="panel"><div class="heading"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="timer" id="timerbox"><small id="timerlabel"></small><strong id="timer">10:00</strong></div></div><div class="steps"><span id="reviewstep" class="step">1 &nbsp; Review</span><span id="answerstep" class="step">2 &nbsp; Answer</span></div><div id="review"><p class="meta" id="readingmeta"></p><div class="reading" id="reading"></div><p><a class="source" id="source" target="_blank" rel="noopener">Open notebook source ↗</a></p><div class="actions"><span class="meta">The reading closes when you start answering.</span><button id="startanswer" class="primary">Start answering →</button></div></div><div id="answer" class="hidden"><div class="question" id="question"></div><div id="locked" class="notice hidden">Time is up. Your answer is locked and saved.</div><label class="meta" for="response">Your response</label><textarea id="response" placeholder="Write your answer here…"></textarea><div class="actions"><span id="wordcount" class="meta"></span><button id="finish" class="secondary">Finish this answer</button></div></div><div class="actions"><button id="prev" class="secondary">← Previous</button><span class="meta" id="status"></span><button id="next" class="secondary">Next →</button></div></main></div>
<script>
const $ = id => document.getElementById(id); let questions=[], session, sessions=[], current=0, last=0, dirty=false, saving=false, pending=false;
const fresh=()=>{const order=questions.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}return {id:crypto.randomUUID(),createdAt:new Date().toISOString(),active:0,order,items:order.map(()=>({phase:'review',review:600,answer:600,text:''}))}};
const backup=()=>{try{localStorage.setItem('study-'+session.id,JSON.stringify(session))}catch(e){$('save').textContent='Browser backup unavailable';$('save').className='save error'}};
function mark(){dirty=true;session.updatedAt=new Date().toISOString();backup();$('save').textContent='Saving…';$('save').className='save'}
async function save(){if(!session||!dirty)return;if(saving){pending=true;return} saving=true;dirty=false;const snapshot=JSON.stringify(session);try{const res=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});if(!res.ok)throw Error('Save failed');const result=await res.json();session.savedAt=result.savedAt;backup();$('save').textContent='Saved '+new Date(result.savedAt).toLocaleTimeString();$('save').className='save'}catch(e){dirty=true;$('save').textContent='Save failed — check local server';$('save').className='save error'}finally{saving=false;if(pending){pending=false;save()}}}
function advance(){const now=Date.now();if(!last){last=now;return} const item=session.items[current];if(!document.hidden&&item.phase!=='done'){const key=item.phase;item[key]=Math.max(0,item[key]-(now-last)/1000);if(item[key]===0){item.phase=key==='review'?'answer':'done';mark();render()} }last=now}
function fmt(n){n=Math.ceil(n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function clock(){let item=session.items[current], n=item.phase==='done'?0:item[item.phase];$('timer').textContent=fmt(n);$('timerlabel').textContent=item.phase==='review'?'Review remaining':item.phase==='answer'?'Answer remaining':'Answer complete';$('timerbox').classList.toggle('urgent',n<60&&item.phase!=='done')}
function render(){const item=session.items[current], q=questions[session.order ? session.order[current] : current], reviewing=item.phase==='review';$('eyebrow').textContent=`Question ${current+1} of ${questions.length}`;$('title').textContent=reviewing?'Review the material':'Your response';$('subtitle').textContent=reviewing?'Read the passage and consult the source before answering.':'Use the question below to structure your answer.';$('review').classList.toggle('hidden',!reviewing);$('answer').classList.toggle('hidden',reviewing);$('reviewstep').classList.toggle('current',reviewing);$('answerstep').classList.toggle('current',!reviewing);$('reading').textContent=q.text;$('readingmeta').textContent=`${q.words.toLocaleString()} words · from ${q.source} · up to 10 minutes`;$('source').href='/source/'+encodeURIComponent(q.source);$('question').textContent=q.question;$('response').value=item.text;$('response').disabled=item.phase==='done';$('locked').classList.toggle('hidden',item.phase!=='done');$('finish').disabled=item.phase==='done';$('wordcount').textContent=(item.text.trim()?item.text.trim().split(/\s+/).length:0)+' words';$('prev').disabled=current===0;$('next').disabled=current===questions.length-1;$('status').textContent=item.phase==='done'?'Answer complete':document.hidden?'Paused':'Timer running';$('grid').replaceChildren(...session.items.map((x,i)=>{let b=document.createElement('button');b.className='qbtn'+(i===current?' active':'')+(x.phase==='done'?' done':'');b.textContent=i+1;b.setAttribute('aria-label',`Question ${i+1}, ${x.phase}`);if(i===current)b.setAttribute('aria-current','step');b.onclick=()=>select(i);return b}));clock()}
function select(i){advance();mark();save();current=i;session.active=i;last=Date.now();mark();render()}
$('response').addEventListener('input',e=>{advance();if(session.items[current].phase==='done'){render();return}session.items[current].text=e.target.value;mark();$('wordcount').textContent=(e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0)+' words'});
$('startanswer').onclick=()=>{advance();if(session.items[current].phase==='review'){session.items[current].phase='answer';mark();render();save()}};
$('finish').onclick=()=>{advance();if(session.items[current].phase==='answer'&&confirm('Finish this answer? You will not be able to edit it afterwards.')){session.items[current].phase='done';mark();render();save()}};
$('prev').onclick=()=>select(current-1);$('next').onclick=()=>select(current+1);
function updateSessions(){let all=[session,...sessions.filter(s=>s.id!==session.id)];$('sessions').replaceChildren(...all.map(s=>{let o=document.createElement('option');o.value=s.id;o.textContent='Session · '+new Date(s.createdAt).toLocaleString();return o}));$('sessions').value=session.id}
$('new').onclick=async()=>{advance();mark();await save();sessions.unshift(session);session=fresh();current=0;last=Date.now();mark();render();updateSessions();save()};
$('sessions').onchange=async e=>{const id=e.target.value;advance();mark();await save();sessions=sessions.filter(s=>s.id!==session.id);sessions.unshift(session);session=sessions.find(s=>s.id===id);current=session.active||0;last=Date.now();render();updateSessions()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){advance();mark();save();last=0}else{last=Date.now();render()}});window.addEventListener('pagehide',()=>{advance();mark();navigator.sendBeacon('/api/session',new Blob([JSON.stringify(session)],{type:'application/json'}))});
async function init(){try{const [q,s]=await Promise.all([fetch('/api/questions'),fetch('/api/sessions')]);if(!q.ok||!s.ok)throw Error();questions=await q.json();sessions=await s.json();sessions.sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));session=sessions[0]||fresh();let local;try{local=JSON.parse(localStorage.getItem('study-'+session.id))}catch(e){}if(local&&new Date(local.updatedAt||local.createdAt)>new Date(session.updatedAt||session.createdAt))session=local;current=session.active||0;last=Date.now();render();updateSessions();mark();save();setInterval(()=>{advance();clock()},250);setInterval(()=>{mark();save()},3000)}catch(e){$('save').textContent='Could not load app — check the local server';$('save').className='save error'}}init();
</script></body></html>
